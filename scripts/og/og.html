<!doctype html>
<!-- Исходник картинки для превью ссылки (public/og.jpg, 1200x630). Рендер: node scripts/og/render-og.mjs -->
<html lang="ru"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@400..800&family=PT+Mono&display=block" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { position: relative; background: #fbf7f3; color: #1e1a19; font-family: "Bitter", Georgia, serif; }
  .text { position: absolute; left: 72px; top: 64px; width: 640px; }
  .eyebrow { font-size: 21px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #6b635f; }
  h1 { margin-top: 18px; font-size: 76px; font-weight: 800; line-height: 1.02; letter-spacing: -0.025em; }
  .mark { padding-bottom: 0.08em; background: linear-gradient(#9b2c3b, #9b2c3b) no-repeat 0 100% / 100% 5px; }
  .lead { margin-top: 28px; font-size: 28px; line-height: 1.35; max-width: 560px; }
  .brand { position: absolute; left: 72px; bottom: 52px; font-size: 40px; font-weight: 800; letter-spacing: -0.01em; }
  .photo { position: absolute; right: 72px; top: 56px; width: 420px; height: 518px; border-radius: 24px; overflow: hidden; }
  .photo img { width: 100%; height: 100%; object-fit: cover; display: block; filter: sepia(0.22) saturate(1.06) contrast(1.04); }
  .stamp {
    position: absolute; right: 392px; top: 448px; z-index: 2;
    padding: 12px 22px; border: 3px solid #9b2c3b; border-radius: 10px; background: #fbf7f3; color: #9b2c3b;
    font-family: "PT Mono", ui-monospace, monospace; font-size: 30px; line-height: 1; letter-spacing: 0.02em;
    transform: rotate(-6deg);
  }
</style></head>
<body>
  <div class="text">
    <p class="eyebrow">Минск&nbsp;· с&nbsp;2019 года</p>
    <h1>Обжарили в&nbsp;<span class="mark">четверг</span>&nbsp;— в&nbsp;<span class="mark">пятницу</span>&nbsp;у&nbsp;вас</h1>
    <p class="lead">Свежеобжаренный кофе: зерно у&nbsp;вас на&nbsp;1–3&nbsp;день после обжарки.</p>
  </div>
  <p class="brand">Кварта</p>
  <div class="photo"><img src="../../public/photos/hero-roaster-800.webp" alt=""></div>
  <span class="stamp">обжарено: чт</span>
</body></html>
